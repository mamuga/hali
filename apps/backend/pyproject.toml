[tool.poetry]
name = "hali-backend"
version = "0.1.0"
description = "HALI FastAPI backend for hyper-local early warning in East Africa."
authors = []
license = "Proprietary"
readme = "README.md"
packages = [{ include = "hali", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = {extras = ["standard"], version = "^0.139.0"}
uvicorn = {extras = ["standard"], version = "^0.49.0"}
asyncpg = "^0.31.0"
httpx = "^0.28.1"
anthropic = "^0.116.0"
apscheduler = "^3.11.3"
shapely = "^2.1.2"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.2.2"
africastalking = "^2.0.2"
psycopg = "^3.3.4"
alembic = "^1.18.5"
structlog = "^26.1.0"
tenacity = ">=9.0"
rasterio = ">=1.5"
xarray = ">=2025.1"
cfgrib = ">=0.9"
netcdf4 = ">=1.7"
cdsapi = ">=0.7"
ftputil = ">=5.1"
pydantic = ">=2.10"
python-dateutil = ">=2.9"
google-generativeai = ">=0.8"
groq = ">=0.12"
asyncio-throttle = ">=1.0"
nltk = ">=3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = ">=0.24"
ruff = "^0.15.20"
black = "^26.5.1"
mypy = "^2.1.0"
pytest-mock = ">=3.14"
respx = ">=0.21"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 300
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 300
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["type-arg", "no-any-return", "arg-type", "call-arg", "attr-defined", "no-untyped-def", "import-untyped"]
plugins = []

[[tool.mypy.overrides]]
module = ["africastalking", "apscheduler.*", "shapely.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
